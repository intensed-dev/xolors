name: Bug report
description: Report a reproducible problem in Xolors
title: "XOL-#### — "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["Color picker", "HEX input", "Color-name search", "Color matching", "Color-space conversion", "Named-color grid", "Copy / clipboard", "Responsive / mobile", Accessibility, "Data / CSV", Performance, Other]
    validations: {required: true}
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [Blocking, Major, Minor, Cosmetic]
    validations: {required: true}
  - type: textarea
    id: summary
    attributes:
      label: What is broken?
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: "1.
2.
3."
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations: {required: true}
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations: {required: true}
  - type: input
    id: color
    attributes:
      label: Color / input
      placeholder: "#7C5CFC or color name"
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Safari, Chrome, Firefox, Edge, Other]
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, device, browser version, Xolors commit/version.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I can reproduce this on the current main branch.
          required: true
        - label: I removed sensitive information.
          required: true
